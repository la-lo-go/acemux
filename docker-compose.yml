services:
  acestream:
    image: ghcr.io/martinbjeldbak/acestream-http-proxy:latest
    container_name: acestream
    environment:
      - ALLOW_REMOTE_ACCESS=true
    ports:
      - "6878:6878"
    restart: unless-stopped

  acemux:
    build: .
    ports:
      - "4321:4321"
    environment:
      - ACESTREAM_ENGINE_URL=http://acestream:6878
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - ACEMUX_API_TOKEN=${ACEMUX_API_TOKEN:-}
      - EPG_FILLER_DAYS=${EPG_FILLER_DAYS:-2}
      - HDHR_DEVICE_ID=${HDHR_DEVICE_ID:-}
      - TZ=${TZ:-UTC}
      - MAX_CLIENTS_PER_STREAM=${MAX_CLIENTS_PER_STREAM:-6}
      - MAX_CONCURRENT_STREAMS=${MAX_CONCURRENT_STREAMS:-3}
      - STREAM_STOP_GRACE_MS=${STREAM_STOP_GRACE_MS:-10000}
      - ACESTREAM_PLAYER_ID=${ACESTREAM_PLAYER_ID:-acemux}
      - PORT=4321
      - HOST=0.0.0.0
    volumes:
      # Named volume: portable across Linux, Windows and macOS with no host chown.
      - acemux_data:/app/data
      # Bind-mount alternative (Linux/NAS may need `chown 1000:1000 ./data`):
      # - ./data:/app/data
    depends_on:
      - acestream
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4321/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  acemux_data:
